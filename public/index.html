<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eigen</title>
    <style>
        :root {
            --font-family: Roboto, sans-serif;
            --bg-color: #111111;
            --bg-color-elevation-0: #222222;
            --font-color: #d4d4d4;
            --container-padding: 16px 16px;
            --container-padding-val: 16px;
            --container-gap: 32px;
            --color-primary: #7549ee;
            --color-primary-dark: purple;
            --color-primary-light: magenta;
            --color-secondary: #29048d;
            --color-secondary-light: #2d02ae;
            --color-secondary-dark: #20026a;
            --font-size-0: 0.875rem;
            --font-size-1: 1rem;
            --font-size-2: 1.125rem;
            --font-size-3: 1.25rem;
            --font-size-4: 1.5rem;
            --font-size-5: 1.875rem;
            --font-size-6: 2.25rem;
            --font-size-7: 3rem;
            --font-weight-semibold: 500;
            --font-weight-bold: 700;
            --border-primary: 1px solid var(--color-primary);
            --border-primary-dark: 1px solid var(--color-primary-dark);
        }

        html {
            margin: 0;
            height: 100%;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
            line-height: 1.5;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
            font-family: system-ui, sans-serif;
        }

        body {
            height: 100%;
            margin: 0;
            background-size: cover;
            background-blend-mode: multiply;
            background-attachment: fixed;
            font-family: var(--font-family), sans-serif;
            background-color: var(--bg-color);
            color: var(--font-color);
            font-size: 1rem;
        }

        body::-webkit-scrollbar {
            width: 16px;
        }

        body::-webkit-scrollbar-thumb {
            height: 56px;
            border-radius: 8px;
            border: 4px solid transparent;
            background-color: hsl(0, 0%, 67%);
            background-clip: content-box;
        }

        .flex {
            display: flex;
        }

        .col {
            display: flex;
            flex-direction: column;
        }

        .row {
            display: flex;
            flex-direction: row;
        }

        .center {
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 640px;
        }

        .td-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .td-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .td-item-parent {
            display: flex;
            gap: 8px;
        }

        .btn-view-current {
            background-color: pink;
            color: black;
        }
    </style>
</head>
<body>
<div class="td-container">
    <h1>Eigen</h1>
    <div is="efl-td-header"></div>
    <div is="efl-td-list" class="td-list"></div>
</div>
<script src="./assets/js/main.js"></script>
<script src="./assets/js/runtime.js"></script>
</body>
</html>
